    <path d="M 784.0 621.7 A 270 270 0 1 1 489.4 263.1 A 236 236 0 0 0 784.0 621.7 Z" fill="url(#layered-body)"/>
    <path d="M 784.0 621.7 A 270 270 0 1 1 489.4 263.1 A 236 236 0 0 0 784.0 621.7 Z" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="34" filter="url(#layered-inner)"/>
    <ellipse cx="420" cy="330" rx="120" ry="70" transform="rotate(-38 420 330)" fill="url(#layered-spec)" opacity="0.7"/>
