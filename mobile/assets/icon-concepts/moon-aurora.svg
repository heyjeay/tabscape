    <path d="M 794.5 613.0 A 300 300 0 1 1 463.6 215.9 A 262 262 0 0 0 794.5 613.0 Z" fill="url(#aurora-body)"/>
    <path d="M 794.5 613.0 A 300 300 0 1 1 463.6 215.9 A 262 262 0 0 0 794.5 613.0 Z" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="34" filter="url(#aurora-inner)"/>
    <ellipse cx="420" cy="330" rx="120" ry="70" transform="rotate(-38 420 330)" fill="url(#aurora-spec)" opacity="0.7"/>
  </g>
  <path d="M 794.5 613.0 A 300 300 0 1 1 463.6 215.9 A 262 262 0 0 0 794.5 613.0 Z" fill="none" stroke="url(#aurora-rim)" stroke-width="9"/>
