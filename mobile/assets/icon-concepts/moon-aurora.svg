<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g id="aurora-bg">
      <rect width="1024" height="1024" fill="#0b0f2a"/>
      
  <filter id="aurora-blobs" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="110"/></filter>
  <g filter="url(#aurora-blobs)"><circle cx="230" cy="260" r="260" fill="#fc4a1a" opacity="0.85"/><circle cx="800" cy="230" r="250" fill="#0072ff" opacity="0.85"/><circle cx="780" cy="820" r="260" fill="#38ef7d" opacity="0.75"/><circle cx="230" cy="800" r="250" fill="#dd2476" opacity="0.85"/></g></g>
  
  
  <defs>
    <clipPath id="aurora-clip"><path d="M 794.5 613.0 A 300 300 0 1 1 463.6 215.9 A 262 262 0 0 0 794.5 613.0 Z"/></clipPath>
    <linearGradient id="aurora-body" x1="0.15" y1="0.1" x2="0.85" y2="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="aurora-rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.8" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="aurora-spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="aurora-shadow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="aurora-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
    <filter id="aurora-frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="aurora-inner"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  
  <path d="M 794.5 613.0 A 300 300 0 1 1 463.6 215.9 A 262 262 0 0 0 794.5 613.0 Z" fill="#000" opacity="0.45" transform="translate(0 34)" filter="url(#aurora-shadow)"/>
  <g clip-path="url(#aurora-clip)">
