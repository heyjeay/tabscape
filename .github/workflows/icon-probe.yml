name: App icon check

# Runs Apple's asset compiler (actool) on the app's Liquid Glass icon (mobile/assets/Tabscape.icon)
# and on a few variations of it, on the same kind of Mac the builds use, to see what it can and
# can't compile. Each variation's result is printed; the run itself never fails.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Variations of the icon
        run: |
          set +e
          xcodebuild -version
          ls /Applications | grep -i xcode
          W="$RUNNER_TEMP/icons"
          mkdir -p "$W"
          cp -R mobile/assets/Tabscape.icon "$W/ours.icon"

          mkdir -p "$W/bare.icon"
          echo '{}' > "$W/bare.icon/icon.json"

          # One change at a time, from the moon-only icon (which crashes) toward the simple one (which compiles).
          mk() {
            cp -R mobile/assets/Tabscape.icon "$W/$1.icon"
            python3 - "$W/$1.icon/icon.json" "$2" <<'PY'
          import json, sys
          p, change = sys.argv[1], sys.argv[2]
          d = json.load(open(p))
          d['groups'] = d['groups'][:1]
          layer = d['groups'][0]['layers'][0]
          sky = d['fill-specializations'][0]['value']
          for c in change.split(','):
              if c == 'hidden': layer['hidden'] = False
              if c == 'nocolorspace': d.pop('color-space-for-untagged-svg-colors', None)
              if c == 'plainfill': d.pop('fill-specializations'); d['fill'] = sky
              if c == 'noorientation': (d['fill'] if 'fill' in d else sky).pop('orientation', None)
              if c == 'autofill': d.pop('fill-specializations', None); d['fill'] = {'automatic-gradient': sky['linear-gradient'][0]}
              if c == 'layersolid': layer.pop('fill-specializations'); layer['fill'] = {'solid': 'extended-srgb:1.00000,0.95686,0.83922,1.00000'}
              if c == 'notintgray':
                  for s in layer.get('fill-specializations', []):
                      if s.get('appearance') == 'tinted': s['value'] = {'solid': 'extended-srgb:1.00000,1.00000,1.00000,0.95000'}
              if c == 'opacity': layer['opacity'] = 1; layer['blend-mode'] = 'normal'
              if c == 'position': d['groups'][0]['position'] = {'scale': 1, 'translation-in-points': [0, 0]}
              if c == 'stars': pass
          json.dump(d, open(p, 'w'), indent=2)
          PY
          }
          mk hidden hidden
          mk nocolorspace nocolorspace
          mk plainfill plainfill
          mk plainfill-noorient plainfill,noorientation
          mk autofill autofill
          mk layersolid layersolid
          mk notintgray notintgray
          mk allfill autofill,layersolid
          mk gradient-layersolid plainfill,noorientation,layersolid,hidden
          mk keep-all-but-orient noorientation,hidden

          for name in hidden nocolorspace plainfill plainfill-noorient autofill layersolid notintgray allfill gradient-layersolid keep-all-but-orient; do
            out="$W/out-$name"
            mkdir -p "$out"
            echo "::group::$name"
            cat "$W/$name.icon/icon.json"
            xcrun actool "$W/$name.icon" --compile "$out" --platform iphoneos --minimum-deployment-target 16.4 \
              --app-icon "$name" --output-partial-info-plist "$out/info.plist" --output-format human-readable-text </dev/null
            echo "RESULT $name: exit $?"
            ls "$out"
            echo "::endgroup::"
            echo "RESULT $name: exit code above"
          done
