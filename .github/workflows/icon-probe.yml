name: App icon check

# Runs Apple's asset compiler (actool) on the app's Liquid Glass icon (mobile/assets/Tabscape.icon)
# and on a few variations of it, on the same kind of Mac the builds use, to see what it can and
# can't compile. Each variation's result is printed; the run itself never fails.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Variations of the icon
        run: |
          set +e
          xcodebuild -version
          ls /Applications | grep -i xcode
          W="$RUNNER_TEMP/icons"
          mkdir -p "$W"
          cp -R mobile/assets/Tabscape.icon "$W/ours.icon"

          mkdir -p "$W/bare.icon"
          echo '{}' > "$W/bare.icon/icon.json"

          for name in ours; do
            out="$W/out-$name"
            mkdir -p "$out"
            echo "::group::$name"
            cat "$W/$name.icon/icon.json"
            xcrun actool "$W/$name.icon" --compile "$out" --platform iphoneos --minimum-deployment-target 16.4 \
              --app-icon "$name" --output-partial-info-plist "$out/info.plist" --output-format human-readable-text </dev/null
            echo "RESULT $name: exit $?"
            ls "$out"
            echo "::endgroup::"
            echo "RESULT $name: exit code above"
          done
